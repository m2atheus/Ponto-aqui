<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B3158">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Painel administrativo de ponto e jornada — Ponto Aqui.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ponto Aqui">
  <link rel="apple-touch-icon" href="icons/brand-symbol.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/favicon-transparent.png"/>

  <title>Ponto Aqui — Administração</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html { --admin-background: #F3F7F9; color-scheme: light; }
    html[data-theme="dark"] { --admin-background: #15191D; color-scheme: dark; }
    html, body { margin: 0; background: var(--admin-background); }
  </style>
  <script>
    // SharedPreferencesAsync Web guarda a string como JSON, sem prefixo.
    // Define o fundo antes da primeira pintura e do carregamento do Flutter.
    try {
      if (JSON.parse(localStorage.getItem('ponto_aqui_theme')) === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (_) { /* Usa o tema claro quando o armazenamento estiver bloqueado. */ }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
