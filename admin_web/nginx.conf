server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;

    # Re-resolve the API container after it is replaced during an update.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/ {
        set $api_upstream http://api:8000;
        # Preserve the entire API path and query string.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Missing assets must return 404, rather than an HTML page.
    location ~* \.(?:js|mjs|wasm|css|json|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # go_router uses browser paths: reloads must serve the Flutter entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
