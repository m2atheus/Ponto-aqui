# Portainer Docker Standalone stack. Images are built and pushed locally.
services:
  api:
    image: ${DOCKERHUB_USER:?Configure DOCKERHUB_USER}/ponto-aqui-api:${IMAGE_TAG:?Configure IMAGE_TAG}
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 100
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  webadmin:
    image: ${DOCKERHUB_USER:?Configure DOCKERHUB_USER}/ponto-aqui-webadmin:${IMAGE_TAG:?Configure IMAGE_TAG}
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
